[package]
authors = ["Mohsen Azimi <me@azimi.me>"]
categories = ["command-line-utilities", "development-tools"]
description = "A tool to serialize a repository into chunks of text files"
edition = "2021"
keywords = ["git", "repository", "serialization", "text", "chunks"]
license = "MIT"
name = "yek"
readme = "README.md"
repository = "https://github.com/mohsen1/yek"
version = "0.100.1"

[dependencies]
anyhow = "1.0"
atty = "0.2.14"
bytesize = "2.0.1"
clap = {version = "4.5", features = ["derive"]}
clap-config-file = "0.6.0"
config = "0.15.11"
content_inspector = "0.2.4"
crossbeam = "0.8"
crossbeam-channel = "0.5"
git2 = {version = "0.18.2", features = ["vendored-openssl", "https"]}
glob = "0.3.2"
ignore = "0.4"
indicatif = "0.17"
normalize-path = "0.2.1"
num_cpus = "1.16"
path-slash = "0.2.1"
rayon = "1.8"
regex = "1.12.2"
serde = {version = "1.0", features = ["derive"]}
serde_derive = "1.0"
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10"
tiktoken-rs = "0.7.0"
time = "0.3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter", "fmt"]}
walkdir = "2.4"

[dev-dependencies]
assert_cmd = "2.0"
chrono = "0.4"
criterion = "0.5"
grcov = "0.10.5"
predicates = "3.0"
rand = "0.8"
tempfile = "3.19"

[[bench]]
harness = false
name = "serialization"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = 'abort'
strip = true

[profile.coverage]
codegen-units = 1
debug = true
debug-assertions = true
incremental = false
inherits = "test"
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = false
